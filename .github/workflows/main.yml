name: Build PonWrt for Nokia XG-040G-MF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for Nokia MF
        run: |
          echo "CONFIG_TARGET_airoha=y" > .config
          echo "CONFIG_TARGET_airoha_an7583=y" >> .config
          echo "CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y" >> .config
          make defconfig

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect Firmware Files
        run: |
          mkdir -p /tmp/firmware
          cp -f bin/targets/airoha/an7583/*nokia_xg-040g-mf* /tmp/firmware/ || true
          ls -lh /tmp/firmware

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-Nokia-XG-040G-MF-Firmware
          path: /tmp/firmware/
