name: Build PonWrt for Nokia XG-040G-MF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for Nokia MF
        run: |
          # 1. 使用作者官方脚本合并 an7583 完整底包与 release 优化配置
          ./scripts/kconfig.pl + configs/an7583.config configs/release.config > .config

          # 2. 锁定目标机型为 Nokia XG-040G-MF (UBI版)
          echo "CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y" >> .config

          # 3. 追加定制组件 (Argon 主题、ttyd 网页终端、测速与排错工具、USB 自动挂载、统计监控)
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          EOF

          # 4. 自动补全并校验所有依赖
          make defconfig

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect Firmware Files
        run: |
          mkdir -p /tmp/firmware
          cp -f bin/targets/airoha/an7583/*nokia_xg-040g-mf* /tmp/firmware/ || true
          ls -lh /tmp/firmware

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-Nokia-XG-040G-MF-Firmware
          path: /tmp/firmware/
